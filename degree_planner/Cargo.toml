[package]
name = "degree_planner"
version = "0.1.0"
edition = "2024"

[lib]
name = "degree_planner"
path = "src/lib.rs"

[[bin]]
name = "degree_planner"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
csv = "1.2"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "json",
] }
dotenvy = "0.15"

[dev-dependencies]
proptest = "1.6"

[[bench]]
name = "course_relations_overhead"
harness = false

[profile.release-fast]
inherits = "release"
opt-level = 2
codegen-units = 256
lto = false
